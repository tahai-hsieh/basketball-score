<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>籃球轉播計分系統</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Arial', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
    touch-action: manipulation;
  }

  body {
    background-color: transparent;
    overflow-x: hidden;
    padding: 10px;
    color: #ffffff;
  }

  body.view-live #summary-section,
  body.view-live #control-section {
    display: none !important;
  }

  body.view-summary #live-section,
  body.view-summary #control-section {
    display: none !important;
  }

  body.view-control {
    background-color: #0f131a;
    overflow-y: auto;
    padding: 20px;
  }

  .preview-label {
    display: none;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 8px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  body.view-control .preview-label {
    display: block;
  }

  /* 響應式縮放外框：自動隨載具直橫屏調整最適大小 */
  .scale-outer {
    width: 100%;
    max-width: 1100px;
    overflow: hidden;
    position: relative;
  }

  body.view-control #live-section,
  body.view-control #summary-section {
    margin-bottom: 26px;
    width: 100%;
    max-width: 1100px;
  }

  .scale-inner {
    width: 1080px;
    transform-origin: top left;
  }

  /* =========================================================
     1. 場上即時轉播計分板 (?view=live)
     ========================================================= */
  .live-scorebug-wrapper {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 1080px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.16);
    user-select: none;
  }

  /* 上層：Logo + 隊名 + 分數 + 節數 */
  .live-scorebug {
    display: flex;
    align-items: stretch;
    height: 92px;
    background: #11161f;
    width: 100%;
  }

  .live-team {
    display: flex;
    align-items: stretch;
    flex: 1;
    min-width: 0;
  }

  .live-team.away {
    flex-direction: row-reverse;
  }

  .live-team-banner {
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex: 1;
    min-width: 0;
    position: relative;
    gap: 14px;
  }

  .live-team.home .live-team-banner {
    flex-direction: row;
  }

  .live-team.away .live-team-banner {
    flex-direction: row-reverse;
  }

  /* 球隊 Logo：固定相同大小正方形、完整顯示且最適版面 */
  .live-logo {
    width: 72px;
    height: 72px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.65));
    flex-shrink: 0;
  }

  .live-info {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }

  /* 隊名加大並置中於色塊區域 */
  .live-name {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 3px 6px rgba(0,0,0,0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
    width: 100%;
    line-height: 1.15;
  }

  /* 分數框 */
  .live-score-box {
    width: 118px;
    height: 92px;
    background: #090c12;
    position: relative;
    overflow: hidden;
    border-left: 1px solid rgba(255,255,255,0.12);
    border-right: 1px solid rgba(255,255,255,0.12);
    flex-shrink: 0;
  }

  .score-track {
    width: 100%;
    height: 276px;
    display: flex;
    flex-direction: column;
    transform: translateY(0);
  }

  .score-slot {
    width: 118px;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    font-weight: 900;
    flex-shrink: 0;
  }

  .score-slot.plus-badge {
    color: #38bdf8;
    font-size: 42px;
    background: #090c12;
  }

  @keyframes slideScoreSequence {
    0%   { transform: translateY(0); }
    18%  { transform: translateY(-92px); }
    72%  { transform: translateY(-92px); }
    92%  { transform: translateY(-184px); }
    100% { transform: translateY(-184px); }
  }

  .animating-slide {
    animation: slideScoreSequence 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* +3 遮罩層：實心深色背景確保絕不露出底層分數，只讓 +3 數字本身震動 */
  .shake-plus3-layer {
    position: absolute;
    inset: 0;
    background: #090c12;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: 900;
    color: #ef4444;
    z-index: 10;
  }

  @keyframes shakeTextOnly {
    0%, 100% { transform: translate(0, 0); }
    15% { transform: translate(-6px, -3px); }
    30% { transform: translate(6px, 3px); }
    45% { transform: translate(-6px, 3px); }
    60% { transform: translate(6px, -3px); }
    75% { transform: translate(-4px, 2px); }
    90% { transform: translate(4px, -2px); }
  }

  .animating-shake-text {
    display: inline-block;
    animation: shakeTextOnly 0.65s ease-in-out;
  }

  /* 中央節數框 */
  .live-center-period {
    width: 106px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #141923;
    font-size: 32px;
    font-weight: 900;
    color: #facc15;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  /* 最下方獨立橫列：左犯規 + 中比賽名稱 + 右犯規（不與隊名同框） */
  .live-bottom-bar {
    background: #090d14;
    color: #ffffff;
    min-height: 48px;
    padding: 6px 18px;
    border-top: 2px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
  }

  /* 左右犯規橫條固定於兩隊色塊下方寬度內 */
  .live-foul-section {
    display: flex;
    align-items: center;
    width: 330px;
    flex-shrink: 0;
  }

  .live-foul-section.away {
    flex-direction: row-reverse;
  }

  .foul-bars {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  .live-foul-section.away .foul-bars {
    flex-direction: row-reverse;
  }

  .foul-bar-item {
    flex: 1;
    height: 9px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.25);
    transition: background-color 0.25s, box-shadow 0.25s;
  }

  .foul-bar-item.active {
    background: #facc15;
    box-shadow: 0 0 8px rgba(250, 204, 21, 0.95);
  }

  .foul-bar-item.bonus-danger {
    background: #ef4444;
    box-shadow: 0 0 10px rgba(239, 68, 68, 1);
  }

  /* 中間比賽名稱：僅依手動 Enter 換行，不自動換行 */
  .live-title-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .live-title-text {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-align: center;
    color: #f8fafc;
    line-height: 1.25;
    white-space: pre;
  }

  /* =========================================================
     2. TPBL 單節總計分板 (?view=summary)
     ========================================================= */
  .scoreboard {
    width: 1080px;
    background: linear-gradient(180deg, #161c24 0%, #090c10 100%);
    color: #ffffff;
    border-bottom: 3px solid #2a3546;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    user-select: none;
    border-radius: 8px;
    overflow: hidden;
  }

  .row {
    display: grid;
    grid-template-columns: 420px 115px 115px 115px 115px 200px;
    align-items: center;
  }

  .header-row {
    min-height: 56px;
    padding: 6px 0;
    background: #0c1017;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 1px;
    border-bottom: 1px solid #262f3d;
  }

  /* 總計分板左上角比賽名稱：僅依手動 Enter 換行，不自動換行 */
  .league-title-wrap {
    width: 420px;
    padding-left: 18px;
    padding-right: 14px;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .league-title {
    font-style: italic;
    font-size: 24px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1px;
    line-height: 1.25;
    white-space: pre;
  }

  .col-q { text-align: center; color: #e0e6ed; }
  .col-q sup { font-size: 13px; }
  .col-total-header {
    text-align: center;
    color: #d4af37;
    font-size: 24px;
    letter-spacing: 2px;
  }

  .team-row {
    height: 68px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .team-banner {
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 32px 0 16px;
    clip-path: polygon(0 0, 100% 0, 93% 100%, 0% 100%);
    gap: 14px;
  }

  /* 總計分板 Logo：固定相同大小正方形、完整顯示且最適版面 */
  .team-logo {
    height: 56px;
    width: 56px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55));
    flex-shrink: 0;
  }

  /* 總計分板隊名放大並往色塊中間靠攏 */
  .team-name {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 1px 2px 5px rgba(0, 0, 0, 0.65);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    text-align: center;
  }

  .score-q {
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    color: #b0b8c4;
  }

  .score-total {
    text-align: center;
    font-size: 40px;
    font-weight: 900;
    color: #ffffff;
  }

  /* =========================================================
     3. 控制台 (?mode=control)
     ========================================================= */
  #control-section {
    width: 100%;
    max-width: 1080px;
    background: #181d26;
    border: 1px solid #2a3140;
    border-radius: 10px;
    padding: 18px;
  }

  .ctrl-top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 16px;
    border-bottom: 1px solid #2a3140;
  }

  .period-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .period-btn {
    background: #283040;
    color: #cbd5e1;
    border: 1px solid #3b465c;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  .period-btn.active {
    background: #eab308;
    color: #000000;
    border-color: #facc15;
  }

  .teams-ctrl-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 768px) {
    .teams-ctrl-grid {
      grid-template-columns: 1fr;
    }
  }

  .team-ctrl-card {
    background: #1f2633;
    border: 1px solid #313b4e;
    border-radius: 8px;
    padding: 16px;
  }

  .ctrl-row {
    margin-bottom: 12px;
  }

  .ctrl-row label {
    display: block;
    font-size: 12.5px;
    color: #94a3b8;
    margin-bottom: 5px;
    font-weight: bold;
  }

  .input-with-color {
    display: flex;
    gap: 8px;
  }

  .team-name-input {
    flex: 1;
    background: #0f131a;
    border: 1px solid #3b465c;
    border-radius: 6px;
    padding: 8px 12px;
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
    resize: vertical;
  }

  .color-picker-input {
    width: 40px;
    height: 38px;
    border: 1px solid #3b465c;
    border-radius: 6px;
    background: none;
    cursor: pointer;
    padding: 0;
  }

  .logo-upload-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ctrl-btn {
    background: #333d52;
    color: #ffffff;
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .ctrl-btn:hover {
    background: #404c66;
  }

  .score-btn-group {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .score-btn {
    padding: 14px 0;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    font-weight: 900;
    color: #ffffff;
    cursor: pointer;
    transition: transform 0.1s;
  }

  .score-btn:active {
    transform: scale(0.95);
  }

  .btn-p1 { background: #0284c7; }
  .btn-p2 { background: #2563eb; }
  .btn-p3 { background: #7c3aed; }
  .btn-m1 { background: #dc2626; }

  .foul-ctrl-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #131720;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #2a3140;
  }

  .ctrl-foul-bars {
    display: flex;
    gap: 6px;
    cursor: pointer;
    flex: 1;
    margin: 0 10px;
  }

  .ctrl-foul-bar {
    flex: 1;
    height: 10px;
    border-radius: 3px;
    background: #334155;
    transition: 0.2s;
  }

  .ctrl-foul-bar.active {
    background: #facc15;
    box-shadow: 0 0 6px #facc15;
  }

  .ctrl-foul-bar.bonus-danger {
    background: #ef4444;
    box-shadow: 0 0 8px #ef4444;
  }
</style>
</head>
<body>

  <!-- 1. 場上即時計分板 (?view=live) -->
  <div id="live-section">
    <div class="preview-label">▼ 預覽 1：場上即時計分板（OBS 連結參數：?view=live）</div>
    <div class="scale-outer" id="scale-outer-live">
      <div class="scale-inner" id="scale-inner-live">
        <div class="live-scorebug-wrapper">
          <!-- 上排：隊徽 + 隊名 + 分數 + 節數 -->
          <div class="live-scorebug">
            <div class="live-team home">
              <div class="live-team-banner" id="live-t1-bg" style="background: #a80707;">
                <img id="live-t1-logo" class="live-logo" src="" alt="" style="display:none;">
                <div class="live-info">
                  <div class="live-name" id="live-t1-name">寶山里</div>
                </div>
              </div>
              <div class="live-score-box" id="box-t1">
                <div class="score-track" id="track-t1">
                  <div class="score-slot" id="slot-t1-cur">0</div>
                  <div class="score-slot plus-badge" id="slot-t1-plus">+2</div>
                  <div class="score-slot" id="slot-t1-next">0</div>
                </div>
                <div class="shake-plus3-layer" id="shake-t1">
                  <span id="shake-text-t1">+3</span>
                </div>
              </div>
            </div>

            <div class="live-center-period" id="live-period">1st</div>

            <div class="live-team away">
              <div class="live-team-banner" id="live-t2-bg" style="background: #689f38;">
                <img id="live-t2-logo" class="live-logo" src="" alt="" style="display:none;">
                <div class="live-info">
                  <div class="live-name" id="live-t2-name">勤和里</div>
                </div>
              </div>
              <div class="live-score-box" id="box-t2">
                <div class="score-track" id="track-t2">
                  <div class="score-slot" id="slot-t2-cur">0</div>
                  <div class="score-slot plus-badge" id="slot-t2-plus">+2</div>
                  <div class="score-slot" id="slot-t2-next">0</div>
                </div>
                <div class="shake-plus3-layer" id="shake-t2">
                  <span id="shake-text-t2">+3</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 下排：左犯規橫條 + 中間比賽名稱 + 右犯規橫條 -->
          <div class="live-bottom-bar" id="live-bottom-bar">
            <div class="live-foul-section home">
              <div class="foul-bars" id="live-t1-fouls-bar"></div>
            </div>
            <div class="live-title-wrap" id="live-title-wrap">
              <div class="live-title-text" id="live-title-display">桃源區運動會社會女子組籃球決賽</div>
            </div>
            <div class="live-foul-section away">
              <div class="foul-bars" id="live-t2-fouls-bar"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 單節總計分板 (?view=summary) -->
  <div id="summary-section">
    <div class="preview-label">▼ 預覽 2：單節總計分板（OBS 連結參數：?view=summary）</div>
    <div class="scale-outer" id="scale-outer-summary">
      <div class="scale-inner" id="scale-inner-summary">
        <div class="scoreboard">
          <div class="row header-row">
            <div class="league-title-wrap" id="sum-title-wrap">
              <div class="league-title" id="sum-league-title">桃源區運動會社會女子組籃球決賽</div>
            </div>
            <div class="col-q">1<sup>st</sup></div>
            <div class="col-q">2<sup>nd</sup></div>
            <div class="col-q">3<sup>rd</sup></div>
            <div class="col-q">4<sup>th</sup></div>
            <div class="col-total-header">TOTAL</div>
          </div>

          <div class="row team-row">
            <div class="team-banner" id="sum-t1-bg">
              <img id="sum-t1-logo" class="team-logo" src="" alt="" style="display:none;">
              <div class="team-name" id="sum-t1-name">寶山里</div>
            </div>
            <div class="score-q" id="sum-t1-q1">0</div>
            <div class="score-q" id="sum-t1-q2"></div>
            <div class="score-q" id="sum-t1-q3"></div>
            <div class="score-q" id="sum-t1-q4"></div>
            <div class="score-total" id="sum-t1-total">0</div>
          </div>

          <div class="row team-row">
            <div class="team-banner" id="sum-t2-bg">
              <img id="sum-t2-logo" class="team-logo" src="" alt="" style="display:none;">
              <div class="team-name" id="sum-t2-name">勤和里</div>
            </div>
            <div class="score-q" id="sum-t2-q1">0</div>
            <div class="score-q" id="sum-t2-q2"></div>
            <div class="score-q" id="sum-t2-q3"></div>
            <div class="score-q" id="sum-t2-q4"></div>
            <div class="score-total" id="sum-t2-total">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 控制台 (?mode=control) -->
  <div id="control-section">
    <div class="ctrl-top-bar">
      <div class="ctrl-row" style="margin-bottom:0; flex:1; min-width:240px;">
        <label>比賽名稱 (按 Enter 可手動換行，不自動換行)</label>
        <textarea class="team-name-input" id="in-game-title" rows="2" oninput="updateGameTitle()">桃源區運動會社會女子組籃球決賽</textarea>
      </div>
      <div class="period-selector">
        <span style="font-weight:bold; color:#cbd5e1; margin-right:4px;">節數：</span>
        <button class="period-btn" id="pbtn-1" onclick="changePeriod(1)">1st</button>
        <button class="period-btn" id="pbtn-2" onclick="changePeriod(2)">2nd</button>
        <button class="period-btn" id="pbtn-3" onclick="changePeriod(3)">3rd</button>
        <button class="period-btn" id="pbtn-4" onclick="changePeriod(4)">4th</button>
      </div>
      <button class="ctrl-btn" id="reset-btn" style="background:#7f1d1d; border-color:#991b1b;" onclick="resetAllScores()">🔄 歸零重設</button>
    </div>

    <div class="teams-ctrl-grid">
      <div class="team-ctrl-card">
        <div class="ctrl-row">
          <label>球隊名稱 & 代表色</label>
          <div class="input-with-color">
            <input type="text" class="team-name-input" id="in-t1-name" value="寶山里" oninput="updateTeamMeta('t1')">
            <input type="color" class="color-picker-input" id="in-t1-color" value="#a80707" oninput="updateTeamMeta('t1')" title="更改背景代表色">
          </div>
        </div>

        <div class="ctrl-row">
          <label>球隊 Logo (自動偵測並統一正方形大小)</label>
          <div class="logo-upload-row">
            <button class="ctrl-btn" onclick="document.getElementById('file-t1').click()">📁 選擇圖片上傳</button>
            <button class="ctrl-btn" id="del-logo-t1" style="display:none;" onclick="removeLogo('t1')">✕ 移除</button>
            <input type="file" id="file-t1" accept="image/*" style="display:none;" onchange="uploadLogo('t1', this)">
          </div>
        </div>

        <div class="ctrl-row">
          <label>加扣分控制 (+1/+2 滑動、+3 單獨震動不顯分)</label>
          <div class="score-btn-group">
            <button class="score-btn btn-p1" onclick="addScore('t1', 1)">+1</button>
            <button class="score-btn btn-p2" onclick="addScore('t1', 2)">+2</button>
            <button class="score-btn btn-p3" onclick="addScore('t1', 3)">+3</button>
            <button class="score-btn btn-m1" onclick="addScore('t1', -1)">-1</button>

        <div class="ctrl-row" style="margin-bottom:0;">

      <div class="team-ctrl-card">
        <div class="ctrl-row">
          <label>球隊名稱 & 代表色</label>
          <div class="input-with-color">
            <input type="text" class="team-name-input" id="in-t2-name" value="勤和里" oninput="updateTeamMeta('t2')">
            <input type="color" class="color-picker-input" id="in-t2-color" value="#689f38" oninput="updateTeamMeta('t2')" title="更改背景代表色">
          </div>
        </div>

        <div class="ctrl-row">
          <label>球隊 Logo (自動偵測並統一正方形大小)</label>
          <div class="logo-upload-row">
            <button class="ctrl-btn" onclick="document.getElementById('file-t2').click()">📁 選擇圖片上傳</button>
            <button class="ctrl-btn" id="del-logo-t2" style="display:none;" onclick="removeLogo('t2')">✕ 移除</button>
            <input type="file" id="file-t2" accept="image/*" style="display:none;" onchange="uploadLogo('t2', this)">
          </div>
        </div>

        <div class="ctrl-row">
          <label>加扣分控制 (+1/+2 滑動、+3 單獨震動不顯分)</label>
          <div class="score-btn-group">
            <button class="score-btn btn-p1" onclick="addScore('t2', 1)">+1</button>
            <button class="score-btn btn-p2" onclick="addScore('t2', 2)">+2</button>
            <button class="score-btn btn-p3" onclick="addScore('t2', 3)">+3</button>
            <button class="score-btn btn-m1" onclick="addScore('t2', -1)">-1</button>
          </div>
        </div>

        <div class="ctrl-row" style="margin-bottom:0;">
          <label>團體犯規次數 (切換節數自動重置)</label>
          <div class="foul-ctrl-box">
            <button class="ctrl-btn" onclick="changeFouls('t2', -1)">−</button>
            <div class="ctrl-foul-bars" id="ctrl-t2-fouls"></div>
            <button class="ctrl-btn" onclick="changeFouls('t2', 1)">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // 鎖定畫面連點兩下不放大，但保留連點兩下按鈕觸發
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      if (e.cancelable) e.preventDefault();
      if (e.target && typeof e.target.click === 'function') {
        e.target.click();
      }
    }
    lastTouchEnd = now;
  }, { passive: false });

  document.addEventListener('dblclick', (e) => {
    e.preventDefault();
  }, { passive: false });

  const firebaseConfig = {
    databaseURL: "https://score-record-0000-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const rootRef = db.ref('tpbl_scoreboard');
  const stateRef = db.ref('tpbl_scoreboard/state');
  const logsRef = db.ref('tpbl_scoreboard/logs');

  const STORAGE_KEY = 'tpbl_clean_state_v2';

  const params = new URLSearchParams(window.location.search);
  const viewParam = params.get('view');
  if (viewParam === 'live') {
    document.body.classList.add('view-live');
  } else if (viewParam === 'summary') {
    document.body.classList.add('view-summary');
  } else {
    document.body.classList.add('view-control');
  }

  const channel = new BroadcastChannel('tpbl_clean_sync_v2');

  // 預設狀態統一為第 1 節 0 分，未開始節數使用空字串 ''（避免 Firebase 將 null 視為刪除欄位）
  const defaultState = {
    gameTitle: '桃源區運動會社會女子組籃球決賽',
    period: 1,
    t1: { name: '寶山里', color: '#a80707', logo: '', fouls: 0, q1: 0, q2: '', q3: '', q4: '' },
    t2: { name: '勤和里', color: '#689f38', logo: '', fouls: 0, q1: 0, q2: '', q3: '', q4: '' }
  };

  let state = loadState();
  let animTimers = { t1: null, t2: null };
  let lastActionId = 0;

  function normalizeTeam(rawTeam, fallbackTeam) {
    const t = rawTeam || {};
    return {
      name: t.name !== undefined ? t.name : fallbackTeam.name,
      color: t.color !== undefined ? t.color : fallbackTeam.color,
      logo: t.logo !== undefined ? t.logo : fallbackTeam.logo,
      fouls: Number(t.fouls) || 0,
      q1: (t.q1 === '' || t.q1 === null || t.q1 === undefined) ? 0 : Number(t.q1),
      q2: (t.q2 === '' || t.q2 === null || t.q2 === undefined) ? '' : Number(t.q2),
      q3: (t.q3 === '' || t.q3 === null || t.q3 === undefined) ? '' : Number(t.q3),
      q4: (t.q4 === '' || t.q4 === null || t.q4 === undefined) ? '' : Number(t.q4)
    };
  }

  function normalizeState(raw) {
    if (!raw) return JSON.parse(JSON.stringify(defaultState));
    return {
      gameTitle: raw.gameTitle !== undefined ? raw.gameTitle : defaultState.gameTitle,
      period: Number(raw.period) || 1,
      t1: normalizeTeam(raw.t1, defaultState.t1),
      t2: normalizeTeam(raw.t2, defaultState.t2),
      updatedAt: raw.updatedAt || null,
      lastAction: raw.lastAction || null
    };
  }

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? normalizeState(JSON.parse(saved)) : JSON.parse(JSON.stringify(defaultState));
    } catch (e) {
      return JSON.parse(JSON.stringify(defaultState));
    }
  }

  function clearAllAnimations() {
    ['t1', 't2'].forEach(k => {
      if (animTimers[k]) {
        clearTimeout(animTimers[k]);
        animTimers[k] = null;
      }
      const track = document.getElementById(`track-${k}`);
      const shakeLayer = document.getElementById(`shake-${k}`);
      const shakeText = document.getElementById(`shake-text-${k}`);
      if (track) {
        track.classList.remove('animating-slide');
        track.style.transform = 'translateY(0)';
        track.style.visibility = 'visible';
        track.style.opacity = '1';
      }
      if (shakeLayer) shakeLayer.style.display = 'none';
      if (shakeText) shakeText.classList.remove('animating-shake-text');
    });
  }

  function saveState(broadcast = true, actionMeta = null) {
    const actionId = Date.now() + Math.random();
    lastActionId = actionId;
    state.updatedAt = new Date().toISOString();
    state.lastAction = actionMeta ? { ...actionMeta, actionId } : { type: 'sync', actionId };

    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (broadcast) {
      channel.postMessage({ type: 'sync', state });
    }

    stateRef.set(state).catch((err) => {
      console.error('Firebase 寫入失敗：', err);
    });
  }

  function pushFirebaseLog(actionDesc, extraData = {}) {
    logsRef.push({
      timestamp: new Date().toISOString(),
      period: state.period,
      action: actionDesc,
      gameTitle: state.gameTitle,
      t1_name: state.t1.name,
      t1_total: getTotal(state.t1),
      t2_name: state.t2.name,
      t2_total: getTotal(state.t2),
      ...extraData
    }).catch((err) => {
      console.error('Firebase 紀錄寫入失敗：', err);
    });
  }

  function getTotal(teamObj) {
    let sum = 0;
    for (let i = 1; i <= 4; i++) {
      if (teamObj[`q${i}`] !== null && teamObj[`q${i}`] !== '' && teamObj[`q${i}`] !== undefined) {
        sum += Number(teamObj[`q${i}`]);
      }
    }
    return sum;
  }

  function getPeriodLabel(p) {
    return p === 1 ? '1st' : p === 2 ? '2nd' : p === 3 ? '3rd' : '4th';
  }

  // 僅根據使用者手動按 Enter 的行數與寬度自動縮放字級，不自動換行
  function adjustTitleFontSize(text) {
    const lines = (text || '').split('\n');
    const lineCount = Math.max(1, lines.length);

    const fitElement = (el, wrapWidth, maxFont) => {
      if (!el) return;
      let size = lineCount > 1 ? Math.min(maxFont, Math.floor(44 / lineCount)) : maxFont;
      el.style.fontSize = size + 'px';
      while (el.scrollWidth > wrapWidth && size > 10) {
        size -= 1;
        el.style.fontSize = size + 'px';
      }
    };

    const liveTitle = document.getElementById('live-title-display');
    const sumTitle = document.getElementById('sum-league-title');
    fitElement(liveTitle, 350, 26);
    fitElement(sumTitle, 385, 25);
  }

  // 隨載具（手機直向、橫向、平板、OBS視窗）自動等比例縮放計分板
  function adjustResponsiveScale() {
    const pairs = [
      { outer: document.getElementById('scale-outer-live'), inner: document.getElementById('scale-inner-live') },
      { outer: document.getElementById('scale-outer-summary'), inner: document.getElementById('scale-inner-summary') }
    ];

    pairs.forEach(({ outer, inner }) => {
      if (!outer || !inner || outer.offsetParent === null) return;
      const availWidth = outer.clientWidth || (window.innerWidth - 20);
      const baseWidth = 1080;
      const scale = Math.min(1, availWidth / baseWidth);
      inner.style.transform = `scale(${scale})`;
      outer.style.height = `${Math.ceil(inner.offsetHeight * scale)}px`;
    });
  }

  window.addEventListener('resize', adjustResponsiveScale);
  window.addEventListener('orientationchange', () => setTimeout(adjustResponsiveScale, 150));

  function renderFoulBars(teamKey, count) {
    const ctrlContainer = document.getElementById(`ctrl-${teamKey}-fouls`);
    const barEl = document.getElementById(`live-${teamKey}-fouls-bar`);
    const isBonus = count >= 5;

    let ctrlHtml = '';
    let liveHtml = '';
    for (let i = 1; i <= 5; i++) {
      const activeClass = i <= count ? (isBonus ? 'bonus-danger' : 'active') : '';
      ctrlHtml += `<div class="ctrl-foul-bar ${activeClass}" onclick="setFoulsDirect('${teamKey}', ${i})"></div>`;
      liveHtml += `<div class="foul-bar-item ${activeClass}"></div>`;
    }
    if (ctrlContainer) ctrlContainer.innerHTML = ctrlHtml;
    if (barEl) barEl.innerHTML = liveHtml;
  }

  function renderUI(skipTeamKey = null) {
    const titleText = state.gameTitle !== undefined ? state.gameTitle : defaultState.gameTitle;
    document.getElementById('live-title-display').textContent = titleText;

    const sumTitle = document.getElementById('sum-league-title');
    if (sumTitle) sumTitle.textContent = titleText;

    adjustTitleFontSize(titleText);

    const gameTitleInput = document.getElementById('in-game-title');
    if (gameTitleInput && document.activeElement !== gameTitleInput) {
      gameTitleInput.value = titleText;
    }

    document.getElementById('live-period').textContent = getPeriodLabel(state.period);

    for (let p = 1; p <= 4; p++) {
      const btn = document.getElementById(`pbtn-${p}`);
      if (btn) btn.classList.toggle('active', state.period === p);
    }

    ['t1', 't2'].forEach(k => {
      const t = state[k];
      const total = getTotal(t);

      document.getElementById(`live-${k}-name`).textContent = t.name;
      document.getElementById(`live-${k}-bg`).style.background = t.color;
      renderFoulBars(k, t.fouls || 0);

      const liveLogo = document.getElementById(`live-${k}-logo`);
      if (t.logo) {
        liveLogo.src = t.logo;
        liveLogo.style.display = 'block';
      } else {
        liveLogo.style.display = 'none';
      }

      if (skipTeamKey !== k) {
        const track = document.getElementById(`track-${k}`);
        track.classList.remove('animating-slide');
        track.style.transform = 'translateY(0)';
        track.style.visibility = 'visible';
        track.style.opacity = '1';
        document.getElementById(`slot-${k}-cur`).textContent = total;
        document.getElementById(`slot-${k}-next`).textContent = total;
        document.getElementById(`shake-${k}`).style.display = 'none';
      }

      document.getElementById(`sum-${k}-name`).textContent = t.name;
      document.getElementById(`sum-${k}-bg`).style.background = `linear-gradient(90deg, ${t.color}dd 0%, ${t.color} 100%)`;
      const sumLogo = document.getElementById(`sum-${k}-logo`);
      if (t.logo) {
        sumLogo.src = t.logo;
        sumLogo.style.display = 'block';
      } else {
        sumLogo.style.display = 'none';
      }

      for (let q = 1; q <= 4; q++) {
        const val = t[`q${q}`];
        document.getElementById(`sum-${k}-q${q}`).textContent = (val === null || val === '' || val === undefined) ? '' : val;
      }
      document.getElementById(`sum-${k}-total`).textContent = total;

      const nameInput = document.getElementById(`in-${k}-name`);
      if (nameInput && document.activeElement !== nameInput) {
        nameInput.value = t.name;
      }
      const colorInput = document.getElementById(`in-${k}-color`);
      if (colorInput) colorInput.value = t.color;
      const delLogoBtn = document.getElementById(`del-logo-${k}`);
      if (delLogoBtn) delLogoBtn.style.display = t.logo ? 'inline-block' : 'none';
    });

    adjustResponsiveScale();
  }

  function playScoreAnimation(teamKey, delta, oldTotal, newTotal) {
    if (animTimers[teamKey]) {
      clearTimeout(animTimers[teamKey]);
      animTimers[teamKey] = null;
    }

    const track = document.getElementById(`track-${teamKey}`);
    const curSlot = document.getElementById(`slot-${teamKey}-cur`);
    const plusSlot = document.getElementById(`slot-${teamKey}-plus`);
    const nextSlot = document.getElementById(`slot-${teamKey}-next`);
    const shakeLayer = document.getElementById(`shake-${teamKey}`);
    const shakeText = document.getElementById(`shake-text-${teamKey}`);

    track.classList.remove('animating-slide');
    shakeLayer.style.display = 'none';
    shakeText.classList.remove('animating-shake-text');

    if (delta === 1 || delta === 2) {
      track.style.visibility = 'visible';
      track.style.opacity = '1';
      curSlot.textContent = oldTotal;
      plusSlot.textContent = `+${delta}`;
      nextSlot.textContent = newTotal;
      void track.offsetWidth;
      track.classList.add('animating-slide');

      animTimers[teamKey] = setTimeout(() => {
        track.classList.remove('animating-slide');
        track.style.transform = 'translateY(0)';
        curSlot.textContent = newTotal;
      }, 1360);
    } else if (delta === 3) {
      track.style.visibility = 'hidden';
      track.style.opacity = '0';

      shakeLayer.style.display = 'flex';
      void shakeText.offsetWidth;
      shakeText.classList.add('animating-shake-text');

      animTimers[teamKey] = setTimeout(() => {
        shakeLayer.style.display = 'none';
        shakeText.classList.remove('animating-shake-text');
        curSlot.textContent = newTotal;
        nextSlot.textContent = newTotal;
        track.style.visibility = 'visible';
        track.style.opacity = '1';
      }, 750);
    } else {
      track.style.visibility = 'visible';
      track.style.opacity = '1';
      curSlot.textContent = newTotal;
      nextSlot.textContent = newTotal;
    }
  }

  function addScore(teamKey, delta) {
    const oldTotal = getTotal(state[teamKey]);
    const qKey = `q${state.period}`;
    const curQScore = Number(state[teamKey][qKey]) || 0;
    state[teamKey][qKey] = Math.max(0, curQScore + delta);
    const newTotal = getTotal(state[teamKey]);

    saveState(false, { type: 'score_update', teamKey, delta, oldTotal, newTotal });
    pushFirebaseLog(`${state[teamKey].name} ${delta > 0 ? '+' + delta : delta}`, { teamKey, delta, oldTotal, newTotal });

    renderUI(teamKey);
    playScoreAnimation(teamKey, delta, oldTotal, newTotal);

    channel.postMessage({ type: 'score_update', state, teamKey, delta, oldTotal, newTotal });
  }

  function changePeriod(p) {
    state.period = p;
    state.t1.fouls = 0;
    state.t2.fouls = 0;

    const qKey = `q${p}`;
    if (state.t1[qKey] === '' || state.t1[qKey] === null || state.t1[qKey] === undefined) state.t1[qKey] = 0;
    if (state.t2[qKey] === '' || state.t2[qKey] === null || state.t2[qKey] === undefined) state.t2[qKey] = 0;

    saveState(true);
    pushFirebaseLog(`切換至第 ${p} 節（犯規重置）`);
    renderUI();
  }

  function changeFouls(teamKey, delta) {
    state[teamKey].fouls = Math.max(0, Math.min(5, (state[teamKey].fouls || 0) + delta));
    saveState(true);
    pushFirebaseLog(`${state[teamKey].name} 團犯變更為 ${state[teamKey].fouls} 次`);
    renderUI();
  }

  function setFoulsDirect(teamKey, val) {
    state[teamKey].fouls = (state[teamKey].fouls === val) ? val - 1 : val;
    saveState(true);
    pushFirebaseLog(`${state[teamKey].name} 團犯變更為 ${state[teamKey].fouls} 次`);
    renderUI();
  }

  function updateGameTitle() {
    state.gameTitle = document.getElementById('in-game-title').value;
    saveState(true);
    renderUI();
  }

  function updateTeamMeta(teamKey) {
    state[teamKey].name = document.getElementById(`in-${teamKey}-name`).value;
    state[teamKey].color = document.getElementById(`in-${teamKey}-color`).value;
    saveState(true);
    renderUI();
  }

  // 自動偵測上傳圖片的實際邊界（裁去多餘透明留白）並等比例置中繪製成 256x256 標準正方形
  function normalizeLogoToSquare(dataUrl, callback) {
    const img = new Image();
    img.onload = () => {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = img.width;
      tempCanvas.height = img.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(img, 0, 0);

      let minX = 0, minY = 0, maxX = img.width, maxY = img.height;
      try {
        const imgData = tempCtx.getImageData(0, 0, img.width, img.height).data;
        let top = img.height, left = img.width, right = 0, bottom = 0;
        let found = false;
        for (let y = 0; y < img.height; y++) {
          for (let x = 0; x < img.width; x++) {
            const alpha = imgData[(y * img.width + x) * 4 + 3];
            if (alpha > 15) {
              if (x < left) left = x;
              if (x > right) right = x;
              if (y < top) top = y;
              if (y > bottom) bottom = y;
              found = true;
            }
          }
        }
        if (found && right >= left && bottom >= top) {
          minX = left;
          minY = top;
          maxX = right + 1;
          maxY = bottom + 1;
        }
      } catch (e) {}

      const cropW = Math.max(1, maxX - minX);
      const cropH = Math.max(1, maxY - minY);
      const targetSize = 256;
      const padding = 8;
      const avail = targetSize - padding * 2;
      const scale = Math.min(avail / cropW, avail / cropH);
      const drawW = cropW * scale;
      const drawH = cropH * scale;
      const dx = (targetSize - drawW) / 2;
      const dy = (targetSize - drawH) / 2;

      const outCanvas = document.createElement('canvas');
      outCanvas.width = targetSize;
      outCanvas.height = targetSize;
      const outCtx = outCanvas.getContext('2d');
      outCtx.drawImage(img, minX, minY, cropW, cropH, dx, dy, drawW, drawH);

      callback(outCanvas.toDataURL('image/png'));
    };
    img.onerror = () => callback(dataUrl);
    img.src = dataUrl;
  }

  function uploadLogo(teamKey, inputEl) {
    const file = inputEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      normalizeLogoToSquare(e.target.result, (squareDataUrl) => {
        state[teamKey].logo = squareDataUrl;
        saveState(true);
        renderUI();
      });
    };
    reader.readAsDataURL(file);
  }

  function removeLogo(teamKey) {
    state[teamKey].logo = '';
    saveState(true);
    renderUI();
  }

  // 歸零重設：清除本機、刪除 Firebase 舊狀態與所有歷史紀錄 (logs)，並強制同步至 OBS 端
  function resetAllScores() {
    clearAllAnimations();

    state.period = 1;
    ['t1', 't2'].forEach(k => {
      state[k].fouls = 0;
      state[k].q1 = 0;
      state[k].q2 = '';
      state[k].q3 = '';
      state[k].q4 = '';
    });

    const actionId = Date.now() + Math.random();
    lastActionId = actionId;
    state.updatedAt = new Date().toISOString();
    state.lastAction = { type: 'reset', actionId };

    // 1. 徹底清除本機暫存並重新寫入歸零狀態
    localStorage.removeItem(STORAGE_KEY);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    // 2. 立即更新當前畫面與同機 OBS 分頁
    renderUI();
    channel.postMessage({ type: 'reset', state });

    // 3. 刪除 Firebase 後台所有舊資料 (包含 state 與 logs)，並寫入乾淨歸零狀態以觸發遠端 OBS 同步
    rootRef.set({
      state: state,
      logs: null
    }).then(() => {
      const btn = document.getElementById('reset-btn');
      if (btn) {
        const origText = btn.textContent;
        btn.textContent = '✅ 已全部歸零';
        setTimeout(() => { btn.textContent = origText; }, 1200);
      }
    }).catch((err) => {
      console.error('Firebase 歸零重設失敗：', err);
    });
  }

  // 監聽 Firebase 資料變動（支援跨裝置與 OBS 瀏覽器來源即時同步）
  stateRef.on('value', (snapshot) => {
    const cloudData = snapshot.val();

    // 若 Firebase 後台整個節點被刪除，本機與 OBS 同步歸零
    if (!cloudData) {
      clearAllAnimations();
      state = JSON.parse(JSON.stringify(defaultState));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderUI();
      return;
    }

    const incomingActionId = cloudData.lastAction ? cloudData.lastAction.actionId : 0;
    if (incomingActionId && incomingActionId === lastActionId) return;
    lastActionId = incomingActionId;

    state = normalizeState(cloudData);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    if (cloudData.lastAction && cloudData.lastAction.type === 'reset') {
      clearAllAnimations();
      renderUI();
    } else if (cloudData.lastAction && cloudData.lastAction.type === 'score_update') {
      const act = cloudData.lastAction;
      renderUI(act.teamKey);
      playScoreAnimation(act.teamKey, act.delta, act.oldTotal, act.newTotal);
    } else {
      renderUI();
    }
  });

  // 同電腦跨視窗 / OBS 瀏覽器來源即時同步
  channel.onmessage = (ev) => {
    if (!ev.data) return;
    if (ev.data.type === 'reset') {
      clearAllAnimations();
      state = normalizeState(ev.data.state);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderUI();
    } else if (ev.data.type === 'sync') {
      state = normalizeState(ev.data.state);
      renderUI();
    } else if (ev.data.type === 'score_update') {
      state = normalizeState(ev.data.state);
      renderUI(ev.data.teamKey);
      playScoreAnimation(ev.data.teamKey, ev.data.delta, ev.data.oldTotal, ev.data.oldTotal !== undefined ? ev.data.newTotal : getTotal(state[ev.data.teamKey]));
    }
  };

  window.addEventListener('storage', (ev) => {
    if (ev.key === STORAGE_KEY) {
      if (!ev.newValue) {
        clearAllAnimations();
        state = JSON.parse(JSON.stringify(defaultState));
      } else {
        state = normalizeState(JSON.parse(ev.newValue));
      }
      renderUI();
    }
  });

  renderUI();
</script>
</body>
</html>
