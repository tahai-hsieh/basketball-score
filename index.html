<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>籃球轉播計分系統</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Arial', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
    touch-action: manipulation;
  }

  body {
    background-color: transparent;
    overflow-x: hidden;
    padding: 10px;
    color: #ffffff;
  }

  body.view-live #summary-section,
  body.view-live #control-section {
    display: none !important;
  }

  body.view-summary #live-section,
  body.view-summary #control-section {
    display: none !important;
  }

  body.view-control {
    background-color: #0f131a;
    overflow-y: auto;
    padding: 20px;
  }

  .preview-label {
    display: none;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  body.view-control .preview-label {
    display: block;
  }

  body.view-control #live-section,
  body.view-control #summary-section {
    margin-bottom: 20px;
    width: 100%;
    max-width: 1060px;
    overflow-x: auto;
  }

  /* 1. 場上即時轉播計分板 (?view=live) */
  .live-scorebug-wrapper {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    max-width: 1040px;
  }

  /* 比賽名稱移到下方，字體放大 */
  .live-title-bar {
    background: #090d14;
    color: #cbd5e1;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 8px 16px;
    border-radius: 0 0 8px 8px;
    border-top: 1px solid rgba(255,255,255,0.08);
    text-align: center;
    word-break: break-word;
    overflow-wrap: break-word;
    display: none;
  }

  .live-scorebug {
    display: flex;
    align-items: stretch;
    height: 78px;
    background: #11161f;
    border-radius: 8px 8px 0 0;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.15);
    user-select: none;
    width: 100%;
  }

  .live-team {
    display: flex;
    align-items: stretch;
    flex: 1;
  }

  .live-team.away {
    flex-direction: row-reverse;
  }

  .live-team-banner {
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex: 1;
    position: relative;
    justify-content: space-between;
  }

  .live-team.away .live-team-banner {
    flex-direction: row-reverse;
  }

  /* 球隊 Logo 調小 */
  .live-logo {
    width: 30px;
    height: 30px;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    flex-shrink: 0;
  }

  .live-team.home .live-logo {
    margin-right: 10px;
  }

  .live-team.away .live-logo {
    margin-left: 10px;
  }

  .live-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    flex: 1;
    overflow: hidden;
  }

  .live-team.away .live-info {
    align-items: flex-end;
  }

  /* 隊名加大 */
  .live-name {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.65);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 犯規次數移到下方並放大字體 */
  .foul-bars {
    display: flex;
    gap: 5px;
    width: 100%;
    justify-content: space-between;
  }

  .foul-bar-item {
    flex: 1;
    height: 6px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.25);
    transition: background-color 0.25s, box-shadow 0.25s;
  }

  .foul-bar-item.active {
    background: #facc15;
    box-shadow: 0 0 5px rgba(250, 204, 21, 0.85);
  }

  .foul-bar-item.bonus-danger {
    background: #ef4444;
    box-shadow: 0 0 6px rgba(239, 68, 68, 0.95);
  }

  .live-score-box {
    width: 105px;
    height: 78px;
    background: #090c12;
    position: relative;
    overflow: hidden;
    border-left: 1px solid rgba(255,255,255,0.1);
    border-right: 1px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
  }

  .score-track {
    width: 100%;
    height: 234px;
    display: flex;
    flex-direction: column;
    transform: translateY(0);
  }

  .score-slot {
    width: 105px;
    height: 78px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 900;
    flex-shrink: 0;
  }

  .score-slot.plus-badge {
    color: #38bdf8;
    font-size: 34px;
    background: rgba(14, 165, 233, 0.15);
  }

  @keyframes slideScoreSequence {
    0%   { transform: translateY(0); }
    18%  { transform: translateY(-78px); }
    72%  { transform: translateY(-78px); }
    92%  { transform: translateY(-156px); }
    100% { transform: translateY(-156px); }
  }

  .animating-slide {
    animation: slideScoreSequence 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* 僅「+3」數字震動動畫 */
  @keyframes shakeTextOnly {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-4px, -2px); }
    40% { transform: translate(4px, 2px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(4px, -2px); }
  }

  .animating-shake-text {
    animation: shakeTextOnly 0.5s ease-in-out;
  }

  .live-center-period {
    width: 95px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #141923;
    font-size: 26px;
    font-weight: 900;
    color: #facc15;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  /* 2. TPBL 單節總計分板 (?view=summary) */
  .scoreboard {
    width: 100%;
    max-width: 1040px;
    background: linear-gradient(180deg, #161c24 0%, #090c10 100%);
    color: #ffffff;
    border-bottom: 3px solid #2a3546;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.75);
    user-select: none;
  }

  .row {
    display: grid;
    grid-template-columns: 340px 90px 90px 90px 90px 160px;
    align-items: center;
  }

  .header-row {
    height: 38px;
    background: #0c1017;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 1px;
    border-bottom: 1px solid #262f3d;
  }

  .league-title {
    padding-left: 20px;
    padding-right: 10px;
    font-style: italic;
    font-size: 16px;
    color: #ffffff;
    letter-spacing: 1px;
    word-break: break-word;
    overflow-wrap: break-word;
    line-height: 1.2;
  }

  .col-q { text-align: center; color: #e0e6ed; }
  .col-q sup { font-size: 11px; }
  .col-total-header {
    text-align: center;
    color: #d4af37;
    font-size: 20px;
    letter-spacing: 2px;
  }

  .team-row {
    height: 54px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .team-banner {
    height: 100%;
    display: flex;
    align-items: center;
    padding-left: 16px;
    clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%);
  }

  .team-logo {
    height: 34px;
    width: 34px;
    object-fit: contain;
    margin-right: 12px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    flex-shrink: 0;
  }

  .team-name {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .score-q {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    color: #b0b8c4;
  }

  .score-total {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    color: #ffffff;
  }

  /* 3. 控制台 */
  #control-section {
    width: 100%;
    max-width: 1040px;
    background: #181d26;
    border: 1px solid #2a3140;
    border-radius: 10px;
    padding: 18px;
  }

  .ctrl-top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 16px;
    border-bottom: 1px solid #2a3140;
  }

  .period-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .period-btn {
    background: #283040;
    color: #cbd5e1;
    border: 1px solid #3b465c;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  .period-btn.active {
    background: #eab308;
    color: #000000;
    border-color: #facc15;
  }

  .teams-ctrl-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 768px) {
    .teams-ctrl-grid {
      grid-template-columns: 1fr;
    }
  }

  .team-ctrl-card {
    background: #1f2633;
    border: 1px solid #313b4e;
    border-radius: 8px;
    padding: 16px;
  }

  .ctrl-row {
    margin-bottom: 12px;
  }

  .ctrl-row label {
    display: block;
    font-size: 12.5px;
    color: #94a3b8;
    margin-bottom: 5px;
    font-weight: bold;
  }

  .input-with-color {
    display: flex;
    gap: 8px;
  }

  .team-name-input {
    flex: 1;
    background: #0f131a;
    border: 1px solid #3b465c;
    border-radius: 6px;
    padding: 8px 12px;
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
  }

  .color-picker-input {
    width: 40px;
    height: 38px;
    border: 1px solid #3b465c;
    border-radius: 6px;
    background: none;
    cursor: pointer;
    padding: 0;
  }

  .logo-upload-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ctrl-btn {
    background: #333d52;
    color: #ffffff;
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .ctrl-btn:hover {
    background: #404c66;
  }

  .score-btn-group {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .score-btn {
    padding: 14px 0;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    font-weight: 900;
    color: #ffffff;
    cursor: pointer;
    transition: transform 0.1s;
  }

  .score-btn:active {
    transform: scale(0.95);
  }

  .btn-p1 { background: #0284c7; }
  .btn-p2 { background: #2563eb; }
  .btn-p3 { background: #7c3aed; }
  .btn-m1 { background: #dc2626; }

  .foul-ctrl-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #131720;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #2a3140;
  }

  .ctrl-foul-bars {
    display: flex;
    gap: 6px;
    cursor: pointer;
    flex: 1;
    margin: 0 10px;
  }

  .ctrl-foul-bar {
    flex: 1;
    height: 10px;
    border-radius: 3px;
    background: #334155;
    transition: 0.2s;
  }

  .ctrl-foul-bar.active {
    background: #facc15;
    box-shadow: 0 0 6px #facc15;
  }

  .ctrl-foul-bar.bonus-danger {
    background: #ef4444;
    box-shadow: 0 0 8px #ef4444;
  }
</style>
</head>
<body>

  <div id="live-section">
    <div class="preview-label">▼ 預覽 1：場上即時計分板（OBS 連結參數：?view=live）</div>
    <div class="live-scorebug-wrapper">
      <div class="live-scorebug">
        <div class="live-team home">
          <div class="live-team-banner" id="live-t1-bg" style="background: #1b4f9c;">
            <img id="live-t1-logo" class="live-logo" src="" alt="" style="display:none;">
            <div class="live-info">
              <div class="live-name" id="live-t1-name">高雄全家海神</div>
              <div class="foul-bars" id="live-t1-fouls"></div>
            </div>
          </div>
          <div class="live-score-box" id="box-t1">
            <div class="score-track" id="track-t1">
              <div class="score-slot" id="slot-t1-cur">112</div>
              <div class="score-slot plus-badge" id="slot-t1-plus">+2</div>
              <div class="score-slot" id="slot-t1-next">112</div>
            </div>
            <!-- +3 動效：純紅色 +3 浮現並震動，不含分數 -->
            <div class="shake-plus3-layer" id="shake-t1" style="position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:40px; font-weight:900; color:#ef4444; z-index:5;"><span class="animating-shake-text">+3</span></div>
          </div>
        </div>

        <div class="live-center-period" id="live-period">4th</div>

        <div class="live-team away">
          <div class="live-team-banner" id="live-t2-bg" style="background: #689f38;">
            <img id="live-t2-logo" class="live-logo" src="" alt="" style="display:none;">
            <div class="live-info">
              <div class="live-name" id="live-t2-name">福爾摩沙夢想家</div>
              <div class="foul-bars" id="live-t2-fouls"></div>
            </div>
          </div>
          <div class="live-score-box" id="box-t2">
            <div class="score-track" id="track-t2">
              <div class="score-slot" id="slot-t2-cur">113</div>
              <div class="score-slot plus-badge" id="slot-t2-plus">+2</div>
              <div class="score-slot" id="slot-t2-next">113</div>
            </div>
            <!-- +3 動效：純紅色 +3 浮現並震動，不含分數 -->
            <div class="shake-plus3-layer" id="shake-t2" style="position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:40px; font-weight:900; color:#ef4444; z-index:5;"><span class="animating-shake-text">+3</span></div>
          </div>
        </div>
      </div>
      <!-- 比賽名稱移到下方，字體放大 -->
      <div class="live-title-bar" id="live-title-display">TPBL 2026-27 例行賽 G002 高雄全家海神 vs. 福爾摩沙夢想家</div>
    </div>
  </div>

  <div id="summary-section">
    <div class="preview-label">▼ 預覽 2：單節總計分板（OBS 連結參數：?view=summary）</div>
    <div class="scoreboard">
      <div class="row header-row">
        <div class="league-title" id="sum-league-title">TPBL 2026-27 例行賽 G002 高雄全家海神 vs. 福爾摩沙夢想家</div>
        <div class="col-q">1<sup>st</sup></div>
        <div class="col-q">2<sup>nd</sup></div>
        <div class="col-q">3<sup>rd</sup></div>
        <div class="col-q">4<sup>th</sup></div>
        <div class="col-total-header">TOTAL</div>
      </div>

      <div class="row team-row">
        <div class="team-banner" id="sum-t1-bg">
          <img id="sum-t1-logo" class="team-logo" src="" alt="" style="display:none;">
          <div class="team-name" id="sum-t1-name">高雄全家海神</div>
        </div>
        <div class="score-q" id="sum-t1-q1">37</div>
        <div class="score-q" id="sum-t1-q2">26</div>
        <div class="score-q" id="sum-t1-q3">25</div>
        <div class="score-q" id="sum-t1-q4">24</div>
        <div class="score-total" id="sum-t1-total">112</div>
      </div>

      <div class="row team-row">
        <div class="team-banner" id="sum-t2-bg">
          <img id="sum-t2-logo" class="team-logo" src="" alt="" style="display:none;">
          <div class="team-name" id="sum-t2-name">福爾摩沙夢想家</div>
        </div>
        <div class="score-q" id="sum-t2-q1">28</div>
        <div class="score-q" id="sum-t2-q2">30</div>
        <div class="score-q" id="sum-t2-q3">31</div>
        <div class="score-q" id="sum-t2-q4">24</div>
        <div class="score-total" id="sum-t2-total">113</div>
      </div>
    </div>
  </div>

  <div id="control-section">
    <div class="ctrl-top-bar">
      <div class="ctrl-row" style="margin-bottom:0; flex:1; min-width:220px;">
        <label>比賽名稱 (手動輸入)</label>
        <input type="text" class="team-name-input" id="in-game-title" value="TPBL 2026-27 例行賽 G002 高雄全家海神 vs. 福爾摩沙夢想家" oninput="updateGameTitle()">
      </div>
      <div class="period-selector">
        <span style="font-weight:bold; color:#cbd5e1; margin-right:4px;">節數：</span>
        <button class="period-btn" id="pbtn-1" onclick="changePeriod(1)">1st</button>
        <button class="period-btn" id="pbtn-2" onclick="changePeriod(2)">2nd</button>
        <button class="period-btn" id="pbtn-3" onclick="changePeriod(3)">3rd</button>
        <button class="period-btn" id="pbtn-4" onclick="changePeriod(4)">4th</button>
      </div>
      <button class="ctrl-btn" style="background:#7f1d1d; border-color:#991b1b;" onclick="resetAllScores()">🔄 歸零重設</button>
    </div>

    <div class="teams-ctrl-grid">
      <div class="team-ctrl-card">
        <div class="ctrl-row">
          <label>球隊名稱 & 代表色</label>
          <div class="input-with-color">
            <input type="text" class="team-name-input" id="in-t1-name" value="高雄全家海神" oninput="updateTeamMeta('t1')">
            <input type="color" class="color-picker-input" id="in-t1-color" value="#1b4f9c" oninput="updateTeamMeta('t1')" title="更改背景代表色">
          </div>
        </div>

        <div class="ctrl-row">
          <label>球隊 Logo (上傳圖片)</label>
          <div class="logo-upload-row">
            <button class="ctrl-btn" onclick="document.getElementById('file-t1').click()">📁 選擇圖片上傳</button>
            <button class="ctrl-btn" id="del-logo-t1" style="display:none;" onclick="removeLogo('t1')">✕ 移除</button>
            <input type="file" id="file-t1" accept="image/*" style="display:none;" onchange="uploadLogo('t1', this)">
          </div>
        </div>

        <div class="ctrl-row">
          <label>加扣分控制 (+1/+2 滑動、+3 僅紅色字體震動)</label>
          <div class="score-btn-group">
            <button class="score-btn btn-p1" onclick="addScore('t1', 1)">+1</button>
            <button class="score-btn btn-p2" onclick="addScore('t1', 2)">+2</button>
            <button class="score-btn btn-p3" onclick="addScore('t1', 3)">+3</button>
            <button class="score-btn btn-m1" onclick="addScore('t1', -1)">-1</button>
          </div>
        </div>

        <div class="ctrl-row" style="margin-bottom:0;">
          <label>團體犯規次數 (切換節數自動重置)</label>
          <div class="foul-ctrl-box">
            <button class="ctrl-btn" onclick="changeFouls('t1', -1)">−</button>
            <div class="ctrl-foul-bars" id="ctrl-t1-fouls"></div>
            <button class="ctrl-btn" onclick="changeFouls('t1', 1)">+</button>
          </div>
        </div>
      </div>

      <div class="team-ctrl-card">
        <div class="ctrl-row">
          <label>球隊名稱 & 代表色</label>
          <div class="input-with-color">
            <input type="text" class="team-name-input" id="in-t2-name" value="福爾摩沙夢想家" oninput="updateTeamMeta('t2')">
            <input type="color" class="color-picker-input" id="in-t2-color" value="#689f38" oninput="updateTeamMeta('t2')" title="更改背景代表色">
          </div>
        </div>

        <div class="ctrl-row">
          <label>球隊 Logo (上傳圖片)</label>
          <div class="logo-upload-row">
            <button class="ctrl-btn" onclick="document.getElementById('file-t2').click()">📁 選擇圖片上傳</button>
            <button class="ctrl-btn" id="del-logo-t2" style="display:none;" onclick="removeLogo('t2')">✕ 移除</button>
            <input type="file" id="file-t2" accept="image/*" style="display:none;" onchange="uploadLogo('t2', this)">
          </div>
        </div>

        <div class="ctrl-row">
          <label>加扣分控制 (+1/+2 滑動、+3 僅紅色字體震動)</label>
          <div class="score-btn-group">
            <button class="score-btn btn-p1" onclick="addScore('t2', 1)">+1</button>
            <button class="score-btn btn-p2" onclick="addScore('t2', 2)">+2</button>
            <button class="score-btn btn-p3" onclick="addScore('t2', 3)">+3</button>
            <button class="score-btn btn-m1" onclick="addScore('t2', -1)">-1</button>
          </div>
        </div>

        <div class="ctrl-row" style="margin-bottom:0;">
          <label>團體犯規次數 (切換節數自動重置)</label>
          <div class="foul-ctrl-box">
            <button class="ctrl-btn" onclick="changeFouls('t2', -1)">−</button>
            <div class="ctrl-foul-bars" id="ctrl-t2-fouls"></div>
            <button class="ctrl-btn" onclick="changeFouls('t2', 1)">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  const firebaseConfig = {
    databaseURL: "https://score-record-0000-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const stateRef = db.ref('tpbl_scoreboard/state');
  const logsRef = db.ref('tpbl_scoreboard/logs');

  const params = new URLSearchParams(window.location.search);
  const viewParam = params.get('view');
  if (viewParam === 'live') {
    document.body.classList.add('view-live');
  } else if (viewParam === 'summary') {
    document.body.classList.add('view-summary');
  } else {
    document.body.classList.add('view-control');
  }

  const channel = new BroadcastChannel('tpbl_clean_sync_v2');

  const defaultState = {
    gameTitle: 'TPBL 2026-27 例行賽 G002 高雄全家海神 vs. 福爾摩沙夢想家',
    period: 4,
    t1: { name: '高雄全家海神', color: '#1b4f9c', logo: '', fouls: 2, q1: 37, q2: 26, q3: 25, q4: 24 },
    t2: { name: '福爾摩沙夢想家', color: '#689f38', logo: '', fouls: 3, q1: 28, q2: 30, q3: 31, q4: 24 }
  };

  let state = loadState();
  let animTimers = { t1: null, t2: null };
  let lastActionId = 0;

  function loadState() {
    try {
      const saved = localStorage.getItem('tpbl_clean_state_v2');
      return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultState));
    } catch (e) {
      return JSON.parse(JSON.stringify(defaultState));
    }
  }

  function saveState(broadcast = true, actionMeta = null) {
    const actionId = Date.now() + Math.random();
    lastActionId = actionId;
    state.updatedAt = new Date().toISOString();
    state.lastAction = actionMeta ? { ...actionMeta, actionId } : { type: 'sync', actionId };

    localStorage.setItem('tpbl_clean_state_v2', JSON.stringify(state));
    if (broadcast) {
      channel.postMessage({ type: 'sync', state });
    }

    stateRef.set(state).catch((err) => {
      console.error('Firebase 寫入失敗：', err);
    });
  }

  function pushFirebaseLog(actionDesc, extraData = {}) {
    logsRef.push({
      timestamp: new Date().toISOString(),
      period: state.period,
      action: actionDesc,
      gameTitle: state.gameTitle,
      t1_name: state.t1.name,
      t1_total: getTotal(state.t1),
      t2_name: state.t2.name,
      t2_total: getTotal(state.t2),
      ...extraData
    }).catch((err) => {
      console.error('Firebase 紀錄寫入失敗：', err);
    });
  }

  function getTotal(teamObj) {
    let sum = 0;
    for (let i = 1; i <= 4; i++) {
      if (teamObj[`q${i}`] !== null && teamObj[`q${i}`] !== '' && teamObj[`q${i}`] !== undefined) {
        sum += Number(teamObj[`q${i}`]);
      }
    }
    return sum;
  }

  function getPeriodLabel(p) {
    return p === 1 ? '1st' : p === 2 ? '2nd' : p === 3 ? '3rd' : '4th';
  }

  function renderFoulBars(teamKey, count) {
    const liveContainer = document.getElementById(`live-${teamKey}-fouls`);
    const ctrlContainer = document.getElementById(`ctrl-${teamKey}-fouls`);
    const isBonus = count >= 5;

    let liveHtml = '';
    let ctrlHtml = '';
    for (let i = 1; i <= 5; i++) {
      const activeClass = i <= count ? (isBonus ? 'bonus-danger' : 'active') : '';
      liveHtml += `<div class="foul-bar-item ${activeClass}"></div>`;
      ctrlHtml += `<div class="ctrl-foul-bar ${activeClass}" onclick="setFoulsDirect('${teamKey}', ${i})"></div>`;
    }
    liveContainer.innerHTML = liveHtml;
    ctrlContainer.innerHTML = ctrlHtml;
  }

  function renderUI(skipTeamKey = null) {
    const titleText = state.gameTitle || 'TPBL 職業籃球聯賽';
    const titleBar = document.getElementById('live-title-display');
    titleBar.textContent = titleText;
    titleBar.style.display = 'block';

    const sumTitle = document.getElementById('sum-league-title');
    if (sumTitle) sumTitle.textContent = titleText;

    const gameTitleInput = document.getElementById('in-game-title');
    if (gameTitleInput && document.activeElement !== gameTitleInput) {
      gameTitleInput.value = titleText;
    }

    document.getElementById('live-period').textContent = getPeriodLabel(state.period);

    for (let p = 1; p <= 4; p++) {
      const btn = document.getElementById(`pbtn-${p}`);
      if (btn) btn.classList.toggle('active', state.period === p);
    }

    ['t1', 't2'].forEach(k => {
      const t = state[k];
      const total = getTotal(t);

      document.getElementById(`live-${k}-name`).textContent = t.name;
      document.getElementById(`live-${k}-bg`).style.background = t.color;
      renderFoulBars(k, t.fouls || 0);

      const liveLogo = document.getElementById(`live-${k}-logo`);
      if (t.logo) {
        liveLogo.src = t.logo;
        liveLogo.style.display = 'block';
      } else {
        liveLogo.style.display = 'none';
      }

      if (skipTeamKey !== k) {
        const track = document.getElementById(`track-${k}`);
        track.classList.remove('animating-slide');
        track.style.transform = 'translateY(0)';
        document.getElementById(`slot-${k}-cur`).textContent = total;
        document.getElementById(`slot-${k}-next`).textContent = total;
        document.getElementById(`shake-${k}`).style.display = 'none';
      }

      document.getElementById(`sum-${k}-name`).textContent = t.name;
      document.getElementById(`sum-${k}-bg`).style.background = `linear-gradient(90deg, ${t.color}dd 0%, ${t.color} 100%)`;
      const sumLogo = document.getElementById(`sum-${k}-logo`);
      if (t.logo) {
        sumLogo.src = t.logo;
        sumLogo.style.display = 'block';
      } else {
        sumLogo.style.display = 'none';
      }

      for (let q = 1; q <= 4; q++) {
        const val = t[`q${q}`];
        document.getElementById(`sum-${k}-q${q}`).textContent = (val === null || val === '' || val === undefined) ? '' : val;
      }
      document.getElementById(`sum-${k}-total`).textContent = total;

      const nameInput = document.getElementById(`in-${k}-name`);
      if (document.activeElement !== nameInput) {
        nameInput.value = t.name;
      }
      document.getElementById(`in-${k}-color`).value = t.color;
      document.getElementById(`del-logo-${k}`).style.display = t.logo ? 'inline-block' : 'none';
    });
  }

  function playScoreAnimation(teamKey, delta, oldTotal, newTotal) {
    if (animTimers[teamKey]) {
      clearTimeout(animTimers[teamKey]);
      animTimers[teamKey] = null;
    }

    const track = document.getElementById(`track-${teamKey}`);
    const curSlot = document.getElementById(`slot-${teamKey}-cur`);
    const plusSlot = document.getElementById(`slot-${teamKey}-plus`);
    const nextSlot = document.getElementById(`slot-${teamKey}-next`);
    const shakeLayer = document.getElementById(`shake-${teamKey}`);

    track.classList.remove('animating-slide');
    shakeLayer.style.display = 'none';

    if (delta === 1 || delta === 2) {
      curSlot.textContent = oldTotal;
      plusSlot.textContent = `+${delta}`;
      nextSlot.textContent = newTotal;
      void track.offsetWidth;
      track.classList.add('animating-slide');

      animTimers[teamKey] = setTimeout(() => {
        track.classList.remove('animating-slide');
        track.style.transform = 'translateY(0)';
        curSlot.textContent = newTotal;
      }, 1360);
    } else if (delta === 3) {
      // 僅顯示紅色「+3」文字震動，不含分數
      curSlot.textContent = newTotal;
      nextSlot.textContent = newTotal;
      shakeLayer.style.display = 'flex';

      animTimers[teamKey] = setTimeout(() => {
        shakeLayer.style.display = 'none';
      }, 700);
    } else {
      curSlot.textContent = newTotal;
      nextSlot.textContent = newTotal;
    }
  }

  function addScore(teamKey, delta) {
    const oldTotal = getTotal(state[teamKey]);
    const qKey = `q${state.period}`;
    const curQScore = state[teamKey][qKey] || 0;
    state[teamKey][qKey] = Math.max(0, curQScore + delta);
    const newTotal = getTotal(state[teamKey]);

    saveState(false, { type: 'score_update', teamKey, delta, oldTotal, newTotal });
    pushFirebaseLog(`${state[teamKey].name} ${delta > 0 ? '+' + delta : delta}`, { teamKey, delta, oldTotal, newTotal });

    renderUI(teamKey);
    playScoreAnimation(teamKey, delta, oldTotal, newTotal);

    channel.postMessage({ type: 'score_update', state, teamKey, delta, oldTotal, newTotal });
  }

  function changePeriod(p) {
    state.period = p;
    state.t1.fouls = 0;
    state.t2.fouls = 0;

    const qKey = `q${p}`;
    if (state.t1[qKey] === null || state.t1[qKey] === undefined) state.t1[qKey] = 0;
    if (state.t2[qKey] === null || state.t2[qKey] === undefined) state.t2[qKey] = 0;

    saveState(true);
    pushFirebaseLog(`切換至第 ${p} 節（犯規重置）`);
    renderUI();
  }

  function changeFouls(teamKey, delta) {
    state[teamKey].fouls = Math.max(0, Math.min(5, (state[teamKey].fouls || 0) + delta));
    saveState(true);
    pushFirebaseLog(`${state[teamKey].name} 團犯變更為 ${state[teamKey].fouls} 次`);
    renderUI();
  }

  function setFoulsDirect(teamKey, val) {
    state[teamKey].fouls = (state[teamKey].fouls === val) ? val - 1 : val;
    saveState(true);
    pushFirebaseLog(`${state[teamKey].name} 團犯變更為 ${state[teamKey].fouls} 次`);
    renderUI();
  }

  function updateGameTitle() {
    state.gameTitle = document.getElementById('in-game-title').value;
    saveState(true);
    renderUI();
  }

  function updateTeamMeta(teamKey) {
    state[teamKey].name = document.getElementById(`in-${teamKey}-name`).value;
    state[teamKey].color = document.getElementById(`in-${teamKey}-color`).value;
    saveState(true);
    renderUI();
  }

  function uploadLogo(teamKey, inputEl) {
    const file = inputEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      state[teamKey].logo = e.target.result;
      saveState(true);
      renderUI();
    };
    reader.readAsDataURL(file);
  }

  function removeLogo(teamKey) {
    state[teamKey].logo = '';
    saveState(true);
    renderUI();
  }

  function resetAllScores() {
    state.period = 1;
    ['t1', 't2'].forEach(k => {
      state[k].fouls = 0;
      state[k].q1 = 0;
      state[k].q2 = null;
      state[k].q3 = null;
      state[k].q4 = null;
    });
    saveState(true);
    pushFirebaseLog('歸零重設整場比分');
    renderUI();
  }

  stateRef.on('value', (snapshot) => {
    const cloudData = snapshot.val();
    if (!cloudData) return;

    const incomingActionId = cloudData.lastAction ? cloudData.lastAction.actionId : 0;
    if (incomingActionId && incomingActionId === lastActionId) return;
    lastActionId = incomingActionId;

    state = {
      ...defaultState,
      ...cloudData,
      t1: { ...defaultState.t1, ...(cloudData.t1 || {}) },
      t2: { ...defaultState.t2, ...(cloudData.t2 || {}) }
    };
    localStorage.setItem('tpbl_clean_state_v2', JSON.stringify(state));

    if (cloudData.lastAction && cloudData.lastAction.type === 'score_update') {
      const act = cloudData.lastAction;
      renderUI(act.teamKey);
      playScoreAnimation(act.teamKey, act.delta, act.oldTotal, act.newTotal);
    } else {
      renderUI();
    }
  });

  channel.onmessage = (ev) => {
    if (!ev.data) return;
    if (ev.data.type === 'sync') {
      state = ev.data.state;
      renderUI();
    } else if (ev.data.type === 'score_update') {
      state = ev.data.state;
      renderUI(ev.data.teamKey);
      playScoreAnimation(ev.data.teamKey, ev.data.delta, ev.data.oldTotal, ev.data.newTotal);
    }
  };

  window.addEventListener('storage', (ev) => {
    if (ev.key === 'tpbl_clean_state_v2' && ev.newValue) {
      state = JSON.parse(ev.newValue);
      renderUI();
    }
  });

  renderUI();
</script>
</body>
</html>
